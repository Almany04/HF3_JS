<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bejelentkezés</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="JS/auth.js" defer></script>
</head>
<body class="bg-body-tertiary d-flex align-items-center py-4">
  <main class="form-container m-auto">
    <h1 class="text-center mb-4 h3">Fejlesztői Adatkezelő</h1>
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title mb-3">Bejelentkezés</h4>
            <div id="loginAlert" class="alert alert-danger d-none">Hibás felhasználónév vagy jelszó.</div>
            <div class="mb-3"><input id="loginUsername" type="text" class="form-control" placeholder="Felhasználónév"></div>
            <div class="mb-3"><input id="loginPassword" type="password" class="form-control" placeholder="Jelszó"></div>
            <button id="loginBtn" class="btn btn-primary w-100">Belépés</button>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title mb-3">Regisztráció</h4>
            <div id="regAlert" class="alert alert-warning d-none"></div>
            <div class="mb-2"><input id="regLastName" type="text" class="form-control" placeholder="Vezetéknév"></div>
            <div class="mb-2"><input id="regFirstName" type="text" class="form-control" placeholder="Keresztnév"></div>
            <div class="mb-2"><input id="regUsername" type="text" class="form-control" placeholder="Felhasználónév"></div>
            <div class="mb-2"><input id="regPassword" type="password" class="form-control" placeholder="Jelszó"></div>
            <div class="mb-3"><input id="regPassword2" type="password" class="form-control" placeholder="Jelszó újra"></div>
            <button id="regBtn" class="btn btn-success w-100" disabled>Regisztráció</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
