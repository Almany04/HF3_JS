<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bejelentkezés</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="JS/auth.js" defer></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Fejlesztői adatkezelő – Bejelentkezés</h1>

    <div class="row g-4">
      <!-- Login -->
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">Bejelentkezés</h4>
            <div id="loginAlert" class="alert alert-danger d-none">Hibás felhasználónév vagy jelszó.</div>
            <div class="mb-3">
              <label class="form-label">Felhasználónév</label>
              <input id="loginUsername" type="text" class="form-control" placeholder="username">
            </div>
            <div class="mb-3">
              <label class="form-label">Jelszó</label>
              <input id="loginPassword" type="password" class="form-control" placeholder="password">
            </div>
            <button id="loginBtn" class="btn btn-primary w-100">Belépés</button>
          </div>
        </div>
      </div>

      <!-- Registration -->
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">Regisztráció</h4>
            <div id="regAlert" class="alert alert-danger d-none"></div>
            <div class="mb-3">
              <label class="form-label">Vezetéknév</label>
              <input id="regLastName" type="text" class="form-control" placeholder="Vezetéknév">
            </div>
            <div class="mb-3">
              <label class="form-label">Keresztnév</label>
              <input id="regFirstName" type="text" class="form-control" placeholder="Keresztnév">
            </div>
            <div class="mb-3">
              <label class="form-label">Felhasználónév</label>
              <input id="regUsername" type="text" class="form-control" placeholder="Felhasználónév">
            </div>
            <div class="mb-3">
              <label class="form-label">Jelszó</label>
              <input id="regPassword" type="password" class="form-control" placeholder="Jelszó">
            </div>
            <div class="mb-3">
              <label class="form-label">Jelszó újra</label>
              <input id="regPassword2" type="password" class="form-control" placeholder="Jelszó újra">
            </div>
            <button id="regBtn" class="btn btn-success w-100" disabled>Regisztráció</button>
            <div class="form-text mt-2">A gomb csak akkor aktív, ha minden mező ki van töltve és a két jelszó megegyezik.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
