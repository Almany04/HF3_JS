<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="JS/main.js" defer></script>
  <script type="module" src="JS/gdpr.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <h1 class="mb-0 fs-3">Fejlesztői adatkezelő</h1>
      <div>
        <span id="welcomeUser" class="me-3 text-muted small"></span>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Kijelentkezés</button>
      </div>
    </header>

    <main>
      <section class="mb-4 p-3 border rounded bg-light">
        <h4 class="mb-3">Szűrés és nézet</h4>
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-3">
          <div class="row g-2 align-items-end">
            <div class="col-auto">
              <label for="jobFilter" class="form-label">Munkakör:</label>
              <select id="jobFilter" class="form-select">
                <option value="">Összes</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Fullstack Developer">Fullstack Developer</option>
                <option value="DevOps Engineer">DevOps Engineer</option>
                <option value="QA Engineer">QA Engineer</option>
                <option value="UI/UX Designer">UI/UX Designer</option>
              </select>
            </div>
            <div class="col-auto">
              <button id="resetFilterBtn" class="btn btn-outline-primary">Szűrő törlése</button>
            </div>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="showInvalid">
            <label class="form-check-label" for="showInvalid">
              Érvénytelen (ID nélküli) rekordok <span id="invalidCount" class="badge bg-secondary ms-1">0</span>
            </label>
          </div>
        </div>
      </section>

      <section class="mb-4 p-3 border rounded bg-light">
        <h4 class="mb-3">Új fejlesztő (JSON)</h4>
        <textarea id="newDevJson" class="form-control mb-2 font-monospace" rows="4" placeholder='{"name":"John Doe","email":"john@doe.com","job":"Frontend Developer","age":28,"salary":4000,"image":"https://i.pravatar.cc/200","skills":["JS","HTML"]}'></textarea>
        <button id="createBtn" class="btn btn-success">Létrehozás</button>
        <div class="form-text mt-2">A név automatikusan monogram prefixet kap. Ha nincs ID, kliensoldali UUID generálódik.</div>
      </section>

      <section class="mb-4 p-3 border rounded bg-primary bg-opacity-10">
        <h4 class="mb-3 text-primary">Fejlesztő szerkesztése</h4>
        <div class="row g-2">
          <div class="col-md-12"><input id="editId" type="text" class="form-control" placeholder="ID (automatikus)" readonly></div>
          <div class="col-md-6"><input id="editName" type="text" class="form-control" placeholder="Név"></div>
          <div class="col-md-6"><input id="editEmail" type="email" class="form-control" placeholder="Email"></div>
          <div class="col-md-4"><input id="editJob" type="text" class="form-control" placeholder="Munkakör"></div>
          <div class="col-md-4"><input id="editAge" type="number" class="form-control" placeholder="Kor"></div>
          <div class="col-md-4"><input id="editSalary" type="number" class="form-control" placeholder="Fizetés"></div>
          <div class="col-md-12"><input id="editImage" type="text" class="form-control" placeholder="Kép URL"></div>
        </div>
        <button id="updateBtn" class="btn btn-danger mt-3">Módosítások mentése</button>
      </section>
      
      <section id="app" class="developer-grid"></section>
    </main>

    <footer id="gdprBanner" class="alert alert-dark fixed-bottom m-3 d-none shadow-lg">
      <div class="d-flex justify-content-between align-items-center">
        <span>Az oldal `localStorage`-t használ a működéshez. Elfogadod?</span>
        <div class="ms-3">
          <button id="gdprAccept" class="btn btn-success btn-sm me-2">Elfogadom</button>
          <button id="gdprDecline" class="btn btn-outline-secondary btn-sm">Elutasítom</button>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
